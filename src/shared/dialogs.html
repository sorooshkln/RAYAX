<dialog id="cart-dialog" class="cart-dialog"><div class="dialog-heading"><h2>سبد خرید شما</h2><span id="drawer-count"></span><button class="icon-btn" data-close aria-label="بستن سبد"><svg><use href="#i-close"/></svg></button></div><div id="cart-items"></div><div id="cart-bottom"></div></dialog>
<dialog id="image-dialog" class="image-dialog"><button class="icon-btn image-close" data-close aria-label="بستن تصویر"><svg><use href="#i-close"/></svg></button><img id="large-image" src="assets/hero.jpg" alt="تصویر بزرگ محصول"><button class="icon-btn gallery-prev" id="prev-image" aria-label="تصویر قبلی"><svg class="" aria-hidden="true"><use href="#i-right"/></svg></button><button class="icon-btn gallery-next" id="next-image" aria-label="تصویر بعدی"><svg class="" aria-hidden="true"><use href="#i-arrow"/></svg></button><div class="modal-counter" id="modal-counter" aria-live="polite">تصویر ۱ از ۸</div></dialog>
<dialog id="info-dialog" class="dialog"><div class="dialog-heading"><h2 id="info-title"></h2><button class="icon-btn" data-close aria-label="بستن"><svg><use href="#i-close"/></svg></button></div><div id="info-content"></div></dialog>
<dialog id="review-dialog" class="dialog"><form id="review-form"><div class="dialog-heading"><h2>دیدگاه شما</h2><button type="button" class="icon-btn" data-close aria-label="بستن"><svg><use href="#i-close"/></svg></button></div><label for="review-name">نام شما</label><input id="review-name" maxlength="60" required readonly><label for="review-title">عنوان دیدگاه</label><input id="review-title" maxlength="80" required placeholder="مثلاً: سبک و مناسب کار روزمره"><fieldset class="rating-field"><legend>امتیاز شما</legend><div class="star-picker" role="radiogroup" aria-label="امتیاز شما"><label class="rating-option"><input type="radio" name="rating" value="1" aria-label="1 از ۵ ستاره" required><svg class="" aria-hidden="true"><use href="#i-star-fill"/></svg><span class="sr-only">1 از ۵</span></label><label class="rating-option"><input type="radio" name="rating" value="2" aria-label="2 از ۵ ستاره" required><svg class="" aria-hidden="true"><use href="#i-star-fill"/></svg><span class="sr-only">2 از ۵</span></label><label class="rating-option"><input type="radio" name="rating" value="3" aria-label="3 از ۵ ستاره" required><svg class="" aria-hidden="true"><use href="#i-star-fill"/></svg><span class="sr-only">3 از ۵</span></label><label class="rating-option"><input type="radio" name="rating" value="4" aria-label="4 از ۵ ستاره" required><svg class="" aria-hidden="true"><use href="#i-star-fill"/></svg><span class="sr-only">4 از ۵</span></label><label class="rating-option"><input type="radio" name="rating" value="5" aria-label="5 از ۵ ستاره" required><svg class="" aria-hidden="true"><use href="#i-star-fill"/></svg><span class="sr-only">5 از ۵</span></label></div><p id="rating-description" aria-live="polite">امتیاز خود را انتخاب کنید</p></fieldset><label for="review-text">تجربه شما</label><textarea id="review-text" rows="4" minlength="10" maxlength="1500" required placeholder="حداقل ۱۰ کاراکتر بنویسید"></textarea><button class="primary full" type="submit">ثبت دیدگاه</button></form></dialog>
<dialog id="profile-dialog" class="profile-dialog" aria-labelledby="profile-title"><div class="dialog-heading"><h2 id="profile-title">حساب کاربری</h2><button class="icon-btn" data-close aria-label="بستن پروفایل"><svg class="" aria-hidden="true"><use href="#i-close"/></svg></button></div><div id="profile-content"></div></dialog>
