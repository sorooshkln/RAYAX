<dialog id="ck-auth" class="dialog ck-dialog ck-auth" aria-labelledby="ck-auth-title"><form id="ck-auth-form" novalidate><div class="ck-auth-head"><img src="assets/logo-dark.svg" alt="RAYAX" width="112" height="31"><button type="button" class="icon-btn" data-close aria-label="بستن"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div><div id="ck-auth-body"></div></form></dialog>
<dialog id="ck-address-dialog" class="dialog ck-dialog ck-address-dlg" aria-labelledby="ck-address-title"><form id="ck-address-form" novalidate><div class="ck-dialog-head"><h2 id="ck-address-title">افزودن آدرس جدید</h2><button type="button" class="icon-btn" data-close aria-label="بستن"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
<div class="ck-dialog-scroll">
<p class="ck-form-label">نشانی</p>
<div class="ck-form-grid"><div class="ck-field"><label for="ad-province">استان</label><select id="ad-province" aria-describedby="ad-province-err"><option value="">انتخاب کنید</option><option>تهران</option><option>البرز</option><option>اصفهان</option><option>خراسان رضوی</option><option>فارس</option><option>آذربایجان شرقی</option><option>خوزستان</option><option>گیلان</option><option>مازندران</option></select><p class="ck-error" id="ad-province-err" hidden></p></div><div class="ck-field"><label for="ad-city">شهر</label><input id="ad-city" autocomplete="address-level2" maxlength="40" aria-describedby="ad-city-err"><p class="ck-error" id="ad-city-err" hidden></p></div></div>
<div class="ck-field"><label for="ad-address">نشانی پستی</label><textarea id="ad-address" rows="2" maxlength="250" autocomplete="street-address" placeholder="خیابان، کوچه و نشانه‌های دقیق" aria-describedby="ad-address-err"></textarea><p class="ck-error" id="ad-address-err" hidden></p></div>
<div class="ck-form-grid three"><div class="ck-field"><label for="ad-plate">پلاک</label><input id="ad-plate" inputmode="numeric" maxlength="6" aria-describedby="ad-plate-err"><p class="ck-error" id="ad-plate-err" hidden></p></div><div class="ck-field"><label for="ad-unit">واحد <small>(اختیاری)</small></label><input id="ad-unit" inputmode="numeric" maxlength="4"></div><div class="ck-field"><label for="ad-postal">کد پستی</label><input id="ad-postal" inputmode="numeric" autocomplete="postal-code" dir="ltr" maxlength="10" placeholder="۱۰ رقم" aria-describedby="ad-postal-err"><p class="ck-error" id="ad-postal-err" hidden></p></div></div>
<p class="ck-form-label">گیرنده سفارش</p>
<label class="ck-check"><input type="checkbox" id="ad-self" checked><span class="ck-check-box"></span><span>گیرنده سفارش خودم هستم</span></label>
<div class="ck-form-grid" id="ad-recipient" hidden><div class="ck-field"><label for="ad-name">نام و نام خانوادگی گیرنده</label><input id="ad-name" autocomplete="name" maxlength="60" aria-describedby="ad-name-err"><p class="ck-error" id="ad-name-err" hidden></p></div><div class="ck-field"><label for="ad-mobile">شماره موبایل گیرنده</label><input id="ad-mobile" inputmode="numeric" autocomplete="tel" dir="ltr" placeholder="09123456789" maxlength="11" aria-describedby="ad-mobile-err"><p class="ck-error" id="ad-mobile-err" hidden></p></div></div>
</div>
<div class="ck-dialog-foot"><button type="button" class="ck-btn ghost" data-close>انصراف</button><button type="submit" class="ck-btn primary">ثبت آدرس</button></div></form></dialog>
<dialog id="ck-gateway" class="dialog ck-dialog" aria-labelledby="ck-gateway-title"><div class="ck-dialog-head"><h2 id="ck-gateway-title">درگاه پرداخت آزمایشی</h2></div><div id="ck-gateway-body"></div></dialog>
