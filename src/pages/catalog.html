<main class="container plp-page" id="catalog">
<nav id="plp-breadcrumb" class="breadcrumb" aria-label="مسیر صفحه"></nav>
<header class="plp-head"><div class="plp-head-text"><h1 id="plp-title">همه محصولات</h1><p id="plp-subtitle"></p></div><span class="plp-total" id="plp-total" role="status"></span></header>
<nav class="plp-cats" id="plp-cats" aria-label="دسته‌بندی محصولات"></nav>
<section class="plp-brands-wrap" id="plp-brands-wrap" aria-labelledby="plp-brands-title"><h2 class="sr-only" id="plp-brands-title">برندها</h2><div class="plp-brands" id="plp-brands"></div></section>
<section class="plp-use" id="plp-use" aria-labelledby="plp-use-title" hidden><h2 id="plp-use-title">مناسب برای:</h2><div class="plp-use-list" id="plp-use-list"></div></section>
<div class="plp-layout">
<aside class="plp-filters" id="plp-filters" aria-label="فیلتر محصولات">
<div class="plp-sheet-head"><strong>فیلترها</strong><button type="button" class="plp-link" id="plp-reset" hidden>حذف همه</button><button type="button" class="plp-close" id="plp-close-filters" aria-label="بستن فیلترها"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
<div class="plp-filter-body" id="plp-filter-body">
<div class="plp-switches"><label class="plp-switch"><span>فقط کالاهای موجود</span><input type="checkbox" id="plp-stock" role="switch"><i aria-hidden="true"></i></label><label class="plp-switch"><span>فقط کالاهای تخفیف‌دار</span><input type="checkbox" id="plp-sale" role="switch"><i aria-hidden="true"></i></label></div>
<details class="plp-group" id="plp-price-group" open><summary>محدودهٔ قیمت <small class="plp-unit">(تومان)</small><svg aria-hidden="true"><use href="#i-down"/></svg></summary><div class="plp-group-body">
<div class="plp-range" id="plp-range"><div class="plp-range-track"><i id="plp-range-fill"></i></div><input type="range" id="plp-min-range" aria-label="حداقل قیمت"><input type="range" id="plp-max-range" aria-label="حداکثر قیمت"></div>
<div class="plp-price-inputs"><label><span>از</span><input id="plp-min" inputmode="numeric" autocomplete="off" aria-describedby="plp-price-error"></label><label><span>تا</span><input id="plp-max" inputmode="numeric" autocomplete="off" aria-describedby="plp-price-error"></label></div>
<p id="plp-price-error" class="plp-error" role="alert" hidden><svg aria-hidden="true"><use href="#i-warning"/></svg>قیمت شروع باید کمتر از قیمت پایان باشد.</p></div></details>
<div id="plp-facets"></div>
</div>
<div class="plp-sheet-foot"><button type="button" class="plp-btn primary block" id="plp-apply">نمایش محصولات</button></div>
</aside>
<div class="plp-results" id="plp-results">
<div class="plp-toolbar" id="plp-toolbar">
<div class="plp-sort-tabs" role="radiogroup" aria-label="مرتب‌سازی" id="plp-sort-tabs"><span class="plp-sort-label"><svg aria-hidden="true"><use href="#i-sort"/></svg>مرتب‌سازی:</span></div>
<div class="plp-mobile-bar"><button type="button" class="plp-bar-btn" id="plp-open-filters" aria-controls="plp-filters" aria-expanded="false"><svg aria-hidden="true"><use href="#i-funnel"/></svg>فیلترها<b id="plp-filter-count" hidden></b></button><button type="button" class="plp-bar-btn" id="plp-open-sort" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#i-sort"/></svg><span id="plp-sort-current">پیشنهادی</span></button></div>
<span class="plp-count" id="plp-count" aria-live="polite"></span>
</div>
<div class="plp-active" id="plp-active" aria-label="فیلترهای فعال"></div>
<div class="catalog-cards plp-grid" id="plp-grid" tabindex="-1"></div>
<div class="plp-more" id="plp-more-wrap"><p id="plp-progress-text"></p><div class="plp-progress" aria-hidden="true"><i id="plp-progress-bar"></i></div><button type="button" class="plp-btn ghost" id="plp-more">نمایش محصولات بیشتر<svg aria-hidden="true"><use href="#i-down"/></svg></button></div>
</div>
</div>
<section class="plp-guide" id="plp-guide"><h2 id="plp-guide-title"></h2><div class="plp-guide-text" id="plp-guide-text"></div><button type="button" class="plp-link" id="plp-guide-toggle" aria-expanded="false" aria-controls="plp-guide-text">بیشتر بخوانید<svg aria-hidden="true"><use href="#i-down"/></svg></button></section>
</main><div class="plp-backdrop" id="plp-backdrop" hidden></div>
<dialog class="dialog plp-brands-dialog" id="plp-brands-dialog" aria-labelledby="plp-brands-dialog-title"><div class="dialog-heading"><h2 id="plp-brands-dialog-title">همهٔ برندها</h2><button type="button" class="icon-btn" data-close aria-label="بستن"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div><div class="plp-brands-all" id="plp-brands-all"></div><button type="button" class="plp-btn primary block" id="plp-brands-done">نمایش محصولات</button></dialog>
<dialog class="dialog plp-sort-dialog" id="plp-sort-dialog" aria-labelledby="plp-sort-dialog-title"><div class="dialog-heading"><h2 id="plp-sort-dialog-title">مرتب‌سازی بر اساس</h2><button type="button" class="icon-btn" data-close aria-label="بستن"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div><div class="plp-sort-list" id="plp-sort-list" role="radiogroup" aria-label="مرتب‌سازی"></div></dialog>
